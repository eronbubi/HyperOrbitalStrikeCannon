<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSC Zielrechner</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: light-dark(#f4f1ea, #14161a);
    --panel: light-dark(#ffffff, #1d2026);
    --ink: light-dark(#1b1d21, #e8e6e1);
    --muted: light-dark(#5d6168, #9aa0a9);
    --line: light-dark(#d5d0c4, #343943);
    --press: light-dark(#b3261e, #ff6b5e);
    --go: light-dark(#1f6f43, #6fd39b);
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.45 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.4rem; margin: 0 0 16px; }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  .target { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; align-items: end; }
  label { display: block; font-size: .9rem; color: var(--muted); margin-bottom: 4px; }
  input[type=number] { width: 100%; padding: 10px 12px; font: 1.15rem var(--mono); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
  button { font: 600 1.05rem system-ui, sans-serif; padding: 11px 22px; border-radius: 8px; border: 0; background: var(--press); color: #fff; cursor: pointer; }
  input:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--go); outline-offset: 2px; }
  details { margin-top: 14px; }
  summary { cursor: pointer; color: var(--muted); font-size: .95rem; }
  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 12px; }
  fieldset { border: 0; padding: 0; margin: 12px 0 0; }
  legend { font-size: .9rem; color: var(--muted); padding: 0; margin-bottom: 4px; }
  .radios { display: flex; flex-wrap: wrap; gap: 4px 18px; }
  .radios label { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); font-size: 1rem; margin: 0; }
  #error { color: var(--press); font-weight: 600; margin: 0; }
  .facts { display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: center; }
  .facts div { min-width: 110px; }
  .facts small { display: block; color: var(--muted); font-size: .85rem; }
  .facts b { font: 600 1.3rem var(--mono); }
  svg { width: 96px; height: 96px; margin-left: auto; flex: none; }
  .rowname { font-weight: 600; margin: 14px 0 6px; display: flex; gap: 10px; align-items: baseline; }
  .rowname span { color: var(--muted); font-weight: 400; font-size: .9rem; }
  .bits { display: grid; grid-template-columns: repeat(15, minmax(0, 1fr)); gap: 3px; }
  .bit { aspect-ratio: 1; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 8px; font: 600 clamp(.7rem, 2.4vw, 1.05rem) var(--mono); color: var(--line); min-width: 0; }
  .bit.on { background: var(--press); border-color: var(--press); color: #fff; }
  .bit.start { background: var(--go); border-color: var(--go); color: #fff; font-size: clamp(.45rem, 1.5vw, .7rem); }
  .note { color: var(--muted); font-size: .92rem; margin: 14px 0 0; }
  ol { margin: 0; padding-left: 22px; }
  li { margin-bottom: 6px; }
  @media (max-width: 560px) { .target { grid-template-columns: 1fr 1fr; } .target button { grid-column: 1 / -1; } }
</style>
</head>
<body>
<main>
  <h1>OSC Zielrechner</h1>

  <form id="form" class="card">
    <div class="target">
      <div><label for="tx">Ziel X</label><input type="number" id="tx" name="tx" step="1" required></div>
      <div><label for="tz">Ziel Z</label><input type="number" id="tz" name="tz" step="1" required></div>
      <button type="submit">Berechnen</button>
    </div>
    <details id="setup">
      <summary>Kanone und Optionen</summary>
      <div class="opts">
        <div><label for="cx">Kanone X (Flugzelle)</label><input type="number" id="cx" name="cx" step="1" required></div>
        <div><label for="cz">Kanone Z (Flugzelle)</label><input type="number" id="cz" name="cz" step="1" required></div>
        <div><label for="ring">Ringradius (leer = schnellster Schuss)</label><input type="number" id="ring" name="ring" step="1" min="0"></div>
      </div>
      <fieldset>
        <legend>Schussrichtung</legend>
        <div class="radios">
          <label><input type="radio" name="dir" value="west" checked> Westen</label>
          <label><input type="radio" name="dir" value="north"> Norden</label>
          <label><input type="radio" name="dir" value="east"> Osten</label>
          <label><input type="radio" name="dir" value="south"> Süden</label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Wo drückst du?</legend>
        <div class="radios">
          <label><input type="radio" name="mode" value="panel" checked> Funk-Pult</label>
          <label><input type="radio" name="mode" value="cannon"> direkt an der Kanone</label>
        </div>
      </fieldset>
    </details>
  </form>

  <div aria-live="polite">
    <div class="card" id="errbox" hidden><p id="error"></p></div>
    <div id="result" hidden>
      <div class="card facts">
        <div><small>Distanz</small><b id="f-dist"></b></div>
        <div><small>Ring (65 TNT)</small><b id="f-ring"></b></div>
        <div><small>bis Einschlag</small><b id="f-time"></b></div>
        <svg id="plot" viewBox="-55 -55 110 110" role="img" aria-label="Form des Rings, Norden oben"></svg>
      </div>
      <div class="card">
        <h2 id="howto"></h2>
        <div id="rows"></div>
        <p class="note" id="rownote"></p>
      </div>
      <div class="card">
        <h2>Dann</h2>
        <ol id="steps"></ol>
      </div>
    </div>
  </div>
</main>

<script>
// Model of the MK.3 chamber: the game's explosion formula, nothing fitted.
// Frame: flight cell centre = origin, cannon fires towards -x.
const SOURCE = { e: [3.99, 0], ne: [2.99, -3], se: [2.99, 3] };
const BLAST_UP = 0.98 * 0.0625, SNOW = 0.9, STACK = [1, -1], TRANSFER = 3, RADIUS = 0.0376;
const BITS = { e: 14, ne: 15, se: 15 };
const NAMES = { ne: "LINKS", e: "GERADE", se: "RECHTS" };
const TURNS = { west: 0, north: 1, east: 2, south: 3 };
const SCAN_LIMIT = 2.0e9;

function push(px, pz, g) {
  const [sx, sz] = SOURCE[g];
  const dx = px - sx, dy = -BLAST_UP, dz = pz - sz;
  const dist = Math.hypot(dx, dy, dz), k = (1 - dist / 8) / dist;
  return [SNOW * dx * k, SNOW * dz * k, -dy * k];
}
function transfer(px, pz) {
  const [dx, dz] = push(px, pz, "ne");
  return [px + TRANSFER * dx, pz + TRANSFER * dz];
}
const START = transfer(...STACK);
function landing(c, p = START) {
  let [x, z] = p;
  for (const g of Object.keys(SOURCE)) {
    const [dx, dz] = push(p[0], p[1], g);
    x += c[g] * dx; z += c[g] * dz;
  }
  return [x, z];
}
function ringPoints(c) {
  const [cx, cz] = landing(c), pts = [];
  for (let i = 0; i < 65; i++) {
    const a = 2 * Math.PI * i / 65;
    const [x, z] = landing(c, transfer(STACK[0] + RADIUS * Math.cos(a), STACK[1] + RADIUS * Math.sin(a)));
    pts.push([x - cx, z - cz]);
  }
  return pts;
}
function ringSize(c) {
  const d = ringPoints(c).map(p => Math.hypot(p[0], p[1]));
  return [Math.min(...d), Math.max(...d)];
}
function sides(dx, dz, ne) {
  const e = push(...START, "e"), a = push(...START, "ne"), b = push(...START, "se");
  const rx = dx - START[0] - ne * e[0], rz = dz - START[1] - ne * e[1];
  const det = a[0] * b[1] - a[1] * b[0];
  return [(rx * b[1] - rz * b[0]) / det, (a[0] * rz - a[1] * rx) / det];
}
function better(s, t) { for (let i = 0; i < s.length; i++) if (s[i] !== t[i]) return s[i] < t[i]; return false; }
function solve(dx, dz, want) {
  let best = null;
  const top = Math.min((1 << BITS.e) - 1, Math.floor(-dx / 0.4) + 3), step = Math.max(1, Math.floor(top / 4000));
  for (let ne = 0; ne <= top; ne += step) {
    const [a, b] = sides(dx, dz, ne);
    if (a < -0.5 || b < -0.5) continue;
    for (const na of [Math.floor(a), Math.ceil(a)]) for (const nb of [Math.floor(b), Math.ceil(b)]) {
      if (na < 0 || nb < 0) continue;
      const c = { e: ne, ne: na, se: nb }, [x, z] = landing(c), miss = Math.hypot(x - dx, z - dz);
      let score;
      if (want === null) score = [Math.round(miss), Math.max(ne, na, nb), miss];
      else { const [lo, hi] = ringSize(c); score = [Math.round(miss), Math.abs((lo + hi) / 2 - want), miss]; }
      if (!best || better(score, best.score)) best = { score, c };
    }
  }
  return best;
}
function turn(px, pz, t) { for (let i = 0; i < ((t % 4) + 4) % 4; i++) [px, pz] = [-pz, px]; return [px, pz]; }
function plan(cx, cz, tx, tz, dir, want) {
  const t = TURNS[dir], wx = tx - cx, wz = tz - cz;
  const [dx, dz] = turn(wx, wz, -t);
  if (dx >= 0 || Math.abs(dz) > -dx * 0.97)
    throw new Error("Dieses Ziel liegt nicht vor der Kanone. Sie trifft nur Ziele in ihrer Schussrichtung, höchstens 44° daneben.");
  const best = solve(dx, dz, want);
  if (!best) throw new Error("Keine Zählerkombination erreicht dieses Ziel.");
  const drop = 1.5 * Object.keys(SOURCE).reduce((s, g) => s + push(...START, g)[2] * best.c[g], 0) + 4;
  if (wz < 0 && Math.abs(wx) * Math.abs(wz) * drop > SCAN_LIMIT)
    throw new Error("Zu weit und zu schräg nach Norden: das Spiel verliert dabei die Payload. Gerader, kürzer oder nach Süden geht.");
  for (const g of Object.keys(BITS))
    if (best.c[g] >= 1 << BITS[g]) throw new Error("Zu weit für diese Kanone.");
  return { counts: best.c, dist: Math.hypot(wx, wz), turns: t };
}
// A button on bit k always subtracts 2^k, so from zero press the bits of the two's complement.
function presses(value, bits) {
  const diff = ((0 - value) % (1 << bits) + (1 << bits)) % (1 << bits);
  return new Set([...Array(bits).keys()].filter(k => diff >> k & 1));
}

const $ = id => document.getElementById(id);
const form = $("form");
function load() {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem("osc3") || "{}"); } catch (e) { /* storage blocked */ }
  for (const [k, v] of Object.entries(saved)) {
    if (k === "dir" || k === "mode") { const el = form.querySelector(`input[name=${k}][value=${v}]`); if (el) el.checked = true; }
    else if (form.elements[k]) form.elements[k].value = v;
  }
  if (form.cx.value === "" || form.cz.value === "") $("setup").open = true;  // first use: the cannon has to be entered once
}
function save(data) { try { localStorage.setItem("osc3", JSON.stringify(data)); } catch (e) { /* ignore */ } }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

function show(r, mode) {
  $("errbox").hidden = true; $("result").hidden = false;
  const [lo, hi] = ringSize(r.counts), sec = (Math.max(...Object.values(r.counts)) * 8 + 2260) / 20;
  $("f-dist").textContent = Math.round(r.dist);
  $("f-ring").textContent = `${Math.round(lo)}–${Math.round(hi)}`;
  $("f-time").textContent = sec < 90 ? Math.round(sec) + " s" : Math.round(sec / 60) + " min";

  const rows = $("rows"); rows.replaceChildren();
  let step = 0;
  for (const g of ["ne", "e", "se"]) {
    const pr = presses(r.counts[g], BITS[g]);
    const name = el("div", "rowname", NAMES[g]);
    name.append(el("span", "", pr.size ? pr.size + " Knöpfe" : "nichts"));
    const bits = el("div", "bits");
    for (let i = 0; i < 15; i++) {
      // panel: LEFT and RIGHT start with bit 0 at the collector line, STRAIGHT is mirrored and ends with START
      const k = mode === "panel" && g === "e" ? 13 - i : i;
      if (mode === "panel" && g === "e" && i === 14) { const s = el("div", "bit start", "START"); s.title = "zuletzt drücken"; bits.append(s); continue; }
      if (k >= BITS[g]) { bits.append(el("div")); continue; }
      const hit = pr.has(k), d = el("div", "bit" + (hit ? " on" : ""), hit ? (mode === "panel" ? String(++step) : "●") : "·");
      d.title = (hit ? "drücken" : "nicht drücken") + ` (Knopf ${i + 1})`;
      bits.append(d);
    }
    rows.append(name, bits);
  }
  const steps = $("steps"); steps.replaceChildren();
  const add = t => steps.append(el("li", "", t));
  if (mode === "panel") {
    $("howto").textContent = "Diese Knöpfe drücken, in dieser Reihenfolge";
    $("rownote").textContent = "So liegen die Reihen am Pult: links die Seite am Portal. Rot = drücken, die Zahl ist die Reihenfolge.";
    add("15 Sekunden warten, dann START drücken.");
    add("Die Kanone lädt und schießt allein. Nicht hingehen.");
    add("Nach dem Einschlag START noch einmal drücken und 2 Minuten warten.");
  } else {
    $("howto").textContent = "Diese Knöpfe drücken";
    $("rownote").textContent = "Links ist der Knopf, der der Kanone am nächsten ist. Rot = einmal drücken, nach jedem warten, bis keine Birne mehr umspringt.";
    add("Start-Hebel umlegen und sofort weg: nach 80 Sekunden geht es los.");
    add("Die Kanone lädt und schießt allein.");
    add("Nach dem Einschlag Hebel zurück und 2 Minuten warten.");
  }
  const pts = ringPoints(r.counts).map(p => turn(p[0], p[1], r.turns));
  const k = 48 / Math.max(1, ...pts.map(p => Math.max(Math.abs(p[0]), Math.abs(p[1]))));
  const svg = $("plot"), ns = "http://www.w3.org/2000/svg"; svg.replaceChildren();
  for (const p of pts) {
    const c = document.createElementNS(ns, "circle");
    c.setAttribute("cx", p[0] * k); c.setAttribute("cy", p[1] * k); c.setAttribute("r", 2.4); c.setAttribute("fill", "var(--press)");
    svg.append(c);
  }
}
form.addEventListener("submit", ev => {
  ev.preventDefault();
  const f = new FormData(form), num = k => Number(f.get(k));
  save(Object.fromEntries(f));
  try {
    show(plan(num("cx"), num("cz"), num("tx"), num("tz"), f.get("dir"), f.get("ring") === "" ? null : num("ring")), f.get("mode"));
    $("setup").open = false;
  } catch (e) { $("result").hidden = true; $("errbox").hidden = false; $("error").textContent = e.message; }
});
load();
</script>
</body>
</html>
